[tool.poetry]
name = "wacky_wahoo" # Name and description subject to change
version = "0.1.0"
description = "wacky wahoo project"
authors = ["Your Name <dshk127mm@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
# Extractor dependencies
google-api-python-client = "^2.92.0"

# The forked chat-downloader from your README
chat-downloader = {git = "https://github.com/Indigo128/chat-downloader.git"}

# Analysis dependencies
staticvectors = "^0.0.3"
regex = "^2023.8.8"

# General utilities
tqdm = "^4.65.0"

# Database dependencies (from your TODOs)
sqlalchemy = {extras = ["asyncio"], version = "^2.0.20"}
alembic = "^1.11.2"
asyncpg = "^0.28.0" # For async postgresql connection with sqlalchemy

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
ruff = "^0.0.286"
mypy = "^1.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 88
target-version = ['py38']

[project]
name = "comment-analysis"
version = "0.1.0"
description = "Data Analysis that somehow doubles as data engineering?"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "GPLv3"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "staticvectors (>=0.2.0,<0.3.0)",
    "google (>=3.0.0,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "google-api-python-client (>=2.201.0,<3.0.0)",
    "google-auth-oauthlib (>=1.5.0,<2.0.0)",
    "chat-downloader @ git+https://github.com/Indigo128/chat-downloader.git"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
